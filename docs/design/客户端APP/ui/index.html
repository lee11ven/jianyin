<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登录 · 见音</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-frame" role="presentation">
    <div class="device-notch" aria-hidden="true"></div>
    <div class="device-screen">
      <div class="auth-layout auth-layout--overlap auth-layout--overlap-login">
        <div class="stage-art" aria-hidden="true"></div>

        <div class="auth-overlap-anchor">
          <!-- d1：m1/m2 同容器、同原点绝对定位；贴齐 b1 顶后下沉 -->
          <div class="stage-mascot-stack">
            <img
              class="stage-mascot stage-mascot--body"
              src="assets/hello-wave.png"
              alt="你好"
            />
            <img
              class="stage-mascot stage-mascot--elbows"
              src="assets/hello-wave-elbows.png"
              alt=""
              aria-hidden="true"
            />
          </div>

          <div class="auth-panel">
            <div class="brand-mark">
              <img src="assets/app-icon.png" width="44" height="44" alt="" />
              <p class="brand">见音</p>
            </div>
            <p class="lede">看见手语，实时听见翻译</p>
            <form class="form" data-nav="home.html" novalidate>
              <div class="field">
                <label for="login-phone">手机号</label>
                <input
                  id="login-phone"
                  name="phone"
                  type="tel"
                  inputmode="tel"
                  autocomplete="username"
                  placeholder="请输入手机号"
                  required
                />
              </div>
              <div class="field">
                <label for="login-password">密码</label>
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="请输入密码"
                  required
                />
              </div>
              <button type="submit" class="btn btn--primary">登录</button>
              <p class="form-footer">
                没有账号？<a href="register.html">注册</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
