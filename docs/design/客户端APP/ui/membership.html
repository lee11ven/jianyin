<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>开通会员 · 见音</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-frame" role="presentation">
    <div class="device-notch" aria-hidden="true"></div>
    <div class="device-screen">
      <header class="app-header">
        <a href="profile.html" class="icon-btn" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </a>
        <h1>开通会员</h1>
      </header>

      <div class="app-scroll">
        <article class="plan-card">
          <h2>免费版</h2>
          <p class="price">¥0 <span>/ 月</span></p>
          <ul>
            <li>每日有限识别时长</li>
            <li>标准播报音质</li>
            <li>最近 7 天字幕历史</li>
          </ul>
          <button type="button" class="btn btn--ghost" disabled>当前方案</button>
        </article>

        <article class="plan-card plan-card--featured">
          <span class="tag">推荐</span>
          <h2>专业月卡</h2>
          <p class="price">¥28 <span>/ 月</span></p>
          <ul>
            <li>不限识别时长</li>
            <li>优先识别队列</li>
            <li>完整字幕历史</li>
            <li>多音色播报</li>
          </ul>
          <button type="button" class="btn btn--primary">立即开通</button>
        </article>

        <article class="plan-card">
          <h2>专业年卡</h2>
          <p class="price">¥198 <span>/ 年</span></p>
          <ul>
            <li>含专业月卡全部权益</li>
            <li>相当于约 ¥16.5 / 月</li>
            <li>专属客服通道</li>
          </ul>
          <button type="button" class="btn btn--primary">立即开通</button>
        </article>
      </div>
    </div>
  </div>
</body>
</html>
