<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>识别 · 见音</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-frame" role="presentation">
    <div class="device-notch" aria-hidden="true"></div>
    <div class="device-screen device-screen--ink">
      <div class="camera-home">
        <div class="camera-preview-fallback" aria-hidden="true">
          <canvas id="camera-noise" class="camera-noise" width="180" height="320"></canvas>
        </div>
        <video
          id="camera-preview"
          class="camera-preview"
          playsinline
          muted
          autoplay
          aria-label="摄像头预览"
        ></video>

        <div class="vp-frame" data-vp="green" aria-hidden="true">
          <div class="vp-frame__box">
            <span class="vp-frame__corner vp-frame__corner--tl"></span>
            <span class="vp-frame__corner vp-frame__corner--tr"></span>
            <span class="vp-frame__corner vp-frame__corner--bl"></span>
            <span class="vp-frame__corner vp-frame__corner--br"></span>
            <div class="vp-frame__shoulder"></div>
            <div class="vp-frame__head"></div>
          </div>
          <p class="vp-frame__caption">机位矫正 · 头肩双手入框</p>
        </div>

        <header class="camera-topbar">
          <div
            id="runtime-status-sense"
            class="runtime-status"
            data-lane="sense"
            data-status="idle"
            role="status"
            aria-live="polite"
          >
            <span class="runtime-status__dot" aria-hidden="true"></span>
            <span class="runtime-status__label">就绪</span>
          </div>
          <div class="camera-topbar__actions">
            <a href="profile.html" class="icon-btn" aria-label="个人中心">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </a>
            <a href="settings.html" class="icon-btn" aria-label="设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </a>
          </div>
        </header>

        <div id="camera-hint" class="camera-hint" role="status">请正对镜头，露出上半身</div>

        <section class="caption-zone" aria-label="识别字幕">
          <div class="caption-label">实时字幕</div>
          <div
            id="caption-stream"
            class="caption-stream"
            aria-live="polite"
            aria-atomic="false"
          ></div>
        </section>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
