<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>设置 · 见音</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-frame" role="presentation">
    <div class="device-notch" aria-hidden="true"></div>
    <div class="device-screen">
      <header class="app-header">
        <a href="home.html" class="icon-btn" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </a>
        <h1>设置</h1>
      </header>

      <div class="app-scroll">
        <form id="settings-form" onsubmit="return false;">
          <section class="settings-group" aria-labelledby="g-recog">
            <h2 id="g-recog">识别</h2>
            <div class="settings-card">
              <div class="slider-row">
                <div class="slider-row-head">
                  <span class="name" id="lbl-confidence">识别置信阈值</span>
                  <span class="value" data-value-for="confidence">0.65</span>
                </div>
                <input
                  type="range"
                  data-setting="confidence"
                  min="0.3"
                  max="0.95"
                  step="0.01"
                  value="0.65"
                  aria-labelledby="lbl-confidence"
                />
              </div>
            </div>
            <p class="settings-note">低于此置信度的识别结果将不展示字幕、不出声。</p>
          </section>

          <section class="settings-group" aria-labelledby="g-view">
            <h2 id="g-view">机位阀门</h2>
            <div class="settings-card">
              <div class="slider-row">
                <div class="slider-row-head">
                  <span class="name" id="lbl-depth-soft">depth.soft</span>
                  <span class="value" data-value-for="depthSoft">0.17</span>
                </div>
                <input
                  type="range"
                  data-setting="depthSoft"
                  min="0.05"
                  max="0.5"
                  step="0.01"
                  value="0.17"
                  aria-labelledby="lbl-depth-soft"
                />
              </div>
              <div class="slider-row">
                <div class="slider-row-head">
                  <span class="name" id="lbl-depth-hard">depth.hard</span>
                  <span class="value" data-value-for="depthHard">0.67</span>
                </div>
                <input
                  type="range"
                  data-setting="depthHard"
                  min="0.3"
                  max="0.95"
                  step="0.01"
                  value="0.67"
                  aria-labelledby="lbl-depth-hard"
                />
              </div>
              <div class="slider-row">
                <div class="slider-row-head">
                  <span class="name" id="lbl-bias-soft">bias.soft</span>
                  <span class="value" data-value-for="biasSoft">0.17</span>
                </div>
                <input
                  type="range"
                  data-setting="biasSoft"
                  min="0.05"
                  max="0.5"
                  step="0.01"
                  value="0.17"
                  aria-labelledby="lbl-bias-soft"
                />
              </div>
              <div class="slider-row">
                <div class="slider-row-head">
                  <span class="name" id="lbl-bias-hard">bias.hard</span>
                  <span class="value" data-value-for="biasHard">0.78</span>
                </div>
                <input
                  type="range"
                  data-setting="biasHard"
                  min="0.4"
                  max="0.95"
                  step="0.01"
                  value="0.78"
                  aria-labelledby="lbl-bias-hard"
                />
              </div>
            </div>
            <p class="settings-note">控制远近与偏移提示的软/硬阈值。一期冷启动加载，原型改动仅保存在本机。</p>
          </section>

          <details class="advanced">
            <summary>高级（抖动与播音）</summary>
            <div class="settings-group" style="margin-top: var(--space-3)">
              <div class="settings-card">
                <div class="slider-row">
                  <div class="slider-row-head">
                    <span class="name" id="lbl-shake">抖动灵敏度</span>
                    <span class="value" data-value-for="shakeSensitivity">0.50</span>
                  </div>
                  <input
                    type="range"
                    data-setting="shakeSensitivity"
                    min="0.1"
                    max="1"
                    step="0.01"
                    value="0.5"
                    aria-labelledby="lbl-shake"
                  />
                </div>
                <div class="slider-row">
                  <div class="slider-row-head">
                    <span class="name" id="lbl-tprime">播音启动水位 T_prime</span>
                    <span class="value" data-value-for="tPrimeMs">100 ms</span>
                  </div>
                  <input
                    type="range"
                    data-setting="tPrimeMs"
                    min="80"
                    max="120"
                    step="1"
                    value="100"
                    aria-labelledby="lbl-tprime"
                  />
                </div>
              </div>
            </div>
          </details>

          <div style="margin-top: var(--space-6)">
            <button type="button" id="settings-reset" class="btn btn--ghost">恢复默认</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
